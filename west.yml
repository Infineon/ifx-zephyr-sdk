manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: infineon-github
      url-base: https://github.com/Infineon

    - name: infineon-gitlab
      url-base: https://gitlab.intra.infineon.com/software-integration/zephyrproject-rtos

    - name: cypress-github
      url-base: https://github.com/cypresssemiconductorco

    - name: lvgl
      url-base: https://github.com/lvgl

  projects:
    - name: ifx-zephyr
      remote: infineon-github
      revision: main
      clone-depth: 1
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6
          - mbedtls
          - trusted-firmware-m
          - zcbor

    - name: lvgl
      remote: lvgl
      revision: 92708ebbbb88fed2db15dfe9324f0dc546222301
      path: modules/lib/gui/lvgl

    # -----------------------------------------------------------------------
    # Infineon ML Middleware — MTB-style mtb_ml_* API + NNLite / Ethos-U55
    # backend glue.
    # -----------------------------------------------------------------------
    - name: mtb-ml-middleware
      remote: infineon-github
      repo-path: ml-middleware
      revision: release-v3.2.0
      path: modules/hal/infineon/ml-middleware/mtb-ml-middleware

    # -----------------------------------------------------------------------
    # Infineon ML TFLite Micro precompiled library.
    # Provides libtensorflow-microlite.a variants compiled per NPU target
    # (NNLite/NNLITE2, Ethos-U55).  Consumed by the ML Middleware CMakeLists.
    # -----------------------------------------------------------------------
    - name: mtb-ml-tflite-micro
      remote: infineon-github
      repo-path: ml-tflite-micro
      revision: release-v3.2.0
      path: modules/hal/infineon/ml-tflite-micro/mtb-ml-tflite-micro

    # -----------------------------------------------------------------------
    # Downstream Hal Infineon with support for ML middleware.
    # -----------------------------------------------------------------------
    - name: hal_infineon
      remote: infineon-github
      repo-path: ifx-zephyr-hal_infineon
      revision: master
      path: modules/hal/infineon
      groups:
        - hal

    # -----------------------------------------------------------------------
    # Audio Front-End and Audio Voice Core Zephyr glue modules.
    # These come from the same repository, but different branches.
    # -----------------------------------------------------------------------
    - name: ifx-zephyr-lib-afe
      remote: infineon-gitlab
      repo-path: ifx-zephyr-lib
      revision: audio-front-end
      path: modules/lib/ifx-audio-front-end

    - name: ifx-zephyr-lib-avc
      remote: infineon-gitlab
      repo-path: ifx-zephyr-lib
      revision: audio-voice-core
      path: modules/lib/ifx-audio-voice-core

    # -----------------------------------------------------------------------
    # Middleware Utilities — Logging, result codes, and common utilities.
    # Zephyr glue module and upstream asset.
    # -----------------------------------------------------------------------
    - name: ifx-zephyr-lib-mwutils
      remote: infineon-gitlab
      repo-path: ifx-zephyr-lib
      revision: connectivity-utilities
      path: modules/lib/ifx-connectivity-utilities

    - name: connectivity-utilities
      remote: cypress-github
      repo-path: connectivity-utilities
      revision: release-v4.5.2
      path: modules/lib/ifx-connectivity-utilities/connectivity-utilities

    # -----------------------------------------------------------------------
    # Upstream audio assets consumed by the glue modules.
    # -----------------------------------------------------------------------
    - name: audio-front-end
      remote: infineon-github
      revision: release-v1.0.2
      path: modules/lib/ifx-audio-front-end/audio-front-end

    - name: audio-voice-core
      remote: infineon-github
      revision: release-v2.0.0
      path: modules/lib/ifx-audio-voice-core/audio-voice-core
