# TinyUSB host example: CDC + MSC + HID
#
# Drives the TinyUSB Zephyr module (CONFIG_TINYUSB). The tusb_config.h in src/
# selects the host classes; the controller port is selected by Kconfig.

# Enable the TinyUSB module and the Infineon DWC2 (PSE84 high-speed) port.
CONFIG_TINYUSB=y
CONFIG_TINYUSB_PORT_DWC2_IFX=y

# Board peripherals used by the BSP glue.
CONFIG_GPIO=y
CONFIG_FPU=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# tuh_task() and the class app tasks run in the main thread; give the main
# stack extra headroom for descriptor parsing and control transfers.
CONFIG_MAIN_STACK_SIZE=4096
