# TinyUSB host example: CDC + MSC + HID
#
# Drives the TinyUSB Zephyr module (CONFIG_TINYUSB). The tusb_config.h in src/
# selects the host classes; the controller port is selected by Kconfig.

# Enable the TinyUSB module and the Infineon DWC2 (PSE84 high-speed) port.
CONFIG_TINYUSB=y
CONFIG_TINYUSB_PORT_DWC2_IFX=y

# Let the TinyUSB module connect the USBHS controller interrupt from devicetree
CONFIG_TINYUSB_DWC2_IFX_IRQ_CONNECT=y

CONFIG_GPIO=y
CONFIG_FPU=y

# The class app tasks run in the main thread (tuh_task() has its own thread);
# give the main stack headroom for descriptor parsing and control transfers.
CONFIG_MAIN_STACK_SIZE=4096
