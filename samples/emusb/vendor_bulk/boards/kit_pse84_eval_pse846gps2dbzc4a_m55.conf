# M55-specific overrides for the emUSB vendor bulk sample.
#
# The Cortex-M55 boots with the data cache enabled, so the USB DMA buffers
# (endpoint memory pool + the app's bulk buffers) are placed in a non-cacheable
# section to stay coherent with the USB DMA engine (see VB_DMA_MEM / __nocache
# in src/main.c and src/usbd_config.c).
CONFIG_NOCACHE_MEMORY=y
