# emUSB vendor-class bulk sample.

# Use the SEGGER emUSB-Device stack with the RTOS-aware OS abstraction.
CONFIG_EMUSB_DEVICE=y
CONFIG_EMUSB_DEVICE_RTOS_AWARE=y

# Use the DMA USB driver for high bulk throughput (offloads the FIFO copy).
CONFIG_EMUSB_DEVICE_DMA=y

# emUSB owns the USBHS controller; keep Zephyr's own USB stack out.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_UDC_DRIVER=n

# Application needs.
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=4096

# The Infineon abstraction-rtos Zephyr backend (emUSB OS layer) uses the
# kernel event objects (k_event_*).
CONFIG_EVENTS=y

# Console output via printk.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Sample options (see Kconfig). Data path mode: source (IN) / sink (OUT) /
# loopback. Match to the host test direction (--mode in / out / both).
CONFIG_APP_VENDOR_BULK_MODE_SOURCE=y
CONFIG_APP_VENDOR_BULK_XFER_SIZE=65536
