# POST subsystem
CONFIG_POST=y
CONFIG_POST_VENDOR_MTB_STL=y
CONFIG_POST_SHELL=y
CONFIG_POST_HALT_ON_FAILURE=n
CONFIG_POST_RUNTIME_TESTS=y

# Enable comparator MTB-STL test
CONFIG_POST_MTB_STL_COMPARATOR=y

# Comparator bench stimulus: set = V+ > V- (high/1), unset = V+ < V- (low/0)
CONFIG_POST_COMP_EXPECT_HIGH=y

# Zephyr driver configs
CONFIG_COMPARATOR=y

# Shell support
CONFIG_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_POST_LOG_LEVEL=4

# Shared interrupts
# Note: This config is enabled by default.
# This config enables to have multiple ISR for same irq line,
# since both test and drivers use same irq line
CONFIG_SHARED_INTERRUPTS=y
