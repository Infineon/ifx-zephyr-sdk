# POST subsystem
CONFIG_POST=y
CONFIG_POST_VENDOR_MTB_STL=y
CONFIG_POST_SHELL=y
CONFIG_POST_HALT_ON_FAILURE=n
CONFIG_POST_RUNTIME_TESTS=y

# POST UART Tests
CONFIG_POST_MTB_STL_UART_LOOPBACK=y
CONFIG_POST_MTB_STL_COMM=y

# Shell support
CONFIG_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_POST_LOG_LEVEL=4
CONFIG_SHARED_INTERRUPTS=y
