# Enable MTB-STL tests
CONFIG_POST_MTB_STL_STARTUP_CFGREG=y
CONFIG_POST_MTB_STL_SAVE_STARTUP_CFGREG=y
CONFIG_POST_MTB_STL_CPU_REGS=y
CONFIG_POST_MTB_STL_CPU_PC=y
CONFIG_POST_MTB_STL_PROGRAM_FLOW=y
CONFIG_POST_MTB_STL_RAM_MARCH=y
CONFIG_POST_MTB_STL_STACK=y
CONFIG_POST_MTB_STL_FLASH=y
CONFIG_POST_MTB_STL_GPIO=y
CONFIG_POST_MTB_STL_WDT=y
CONFIG_POST_MTB_STL_INTERRUPT=y
CONFIG_POST_MTB_STL_CLOCK=y
CONFIG_POST_MTB_STL_FPU=y
CONFIG_POST_MTB_STL_DMA=y

# Zephyr driver configs
CONFIG_COUNTER=y
CONFIG_FPU=y
CONFIG_DYNAMIC_INTERRUPTS=y
