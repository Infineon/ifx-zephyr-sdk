CONFIG_GPIO=y

# CMSIS-DSP is not available for this target configuration.
# Keep unset to avoid an unsatisfied-dependency warning.

# Enable Audio Front-End module
CONFIG_AUDIOFE=y

# Audio Voice Core dependency - disabled for basic AFE testing
# CONFIG_AVC=y
# CONFIG_AVC_SPEECH_ENH=y

# Enable Middleware Utilities dependency
CONFIG_MWUTILS=y
CONFIG_MWUTILS_LOG=y

# AFE feature configuration - Basic functionality only
# Speech enhancement requires AVC integration - DISABLED
# CONFIG_AUDIOFE_SPEECH_ENH=n
CONFIG_AUDIOFE_LOGGING=n
CONFIG_AUDIOFE_BASIC_ONLY=y
# Disable tuning entirely - causes usage fault in test applications
CONFIG_AUDIOFE_TUNING=n

# Enable official Infineon RTOS abstraction for Zephyr
CONFIG_USE_INFINEON_ABSTRACTION_RTOS=y

# Enable kernel memory pool for k_malloc/k_aligned_alloc (required by abstraction-rtos)
CONFIG_KERNEL_MEM_POOL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Zephyr thread configuration for AFE tasks
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NUM_PREEMPT_PRIORITIES=32

# Enable dynamic thread support needed by abstraction-rtos
CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y