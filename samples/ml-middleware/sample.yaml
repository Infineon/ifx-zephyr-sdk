sample:
  name: PSE84 ML Middleware Demo
  description: >
    Demonstrates Infineon ML Middleware usage with NPU acceleration on PSE84.
    NNLite path targets kit_pse84_eval/pse846gps2dbzc4a/m33 (M33 + NNLite NPU).
    Ethos-U55 path targets kit_pse84_ai/pse846gps2dbzc4a/m55 (M55 + Ethos-U55 NPU).
tests:
  sample.boards.pse84.ml_middleware.nnlite:
    platform_allow: kit_pse84_eval/pse846gps2dbzc4a/m33
    tags:
      - ml
      - ai
      - npu
      - infineon
      - nnlite
      - pse84
    extra_configs:
      - CONFIG_ML_MIDDLEWARE_NNLITE=y
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "ML Middleware Demo Started"
        - "Model loaded successfully"
        - "Inference completed"
  sample.boards.pse84.ml_middleware.u55:
    platform_allow: kit_pse84_ai/pse846gps2dbzc4a/m55
    tags:
      - ml
      - ai
      - npu
      - infineon
      - ethos_u55
      - pse84
    extra_configs:
      - CONFIG_ML_MIDDLEWARE_ETHOS_U55=y
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "ML Middleware Demo Started"
        - "Model loaded successfully"
        - "Inference completed"
common:
  modules:
    - hal_infineon
  build_only: true