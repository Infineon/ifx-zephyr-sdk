# Configuration overlay for M33 + NNLite NPU + Infineon ML Middleware + DEEPCRAFT IMAI model
#
# Build command (from ml-middleware-example/ directory):
#   west build --pristine -b kit_pse84_eval/pse846gps2dbzc4a/m33 \
#     . -- -DOVERLAY_CONFIG="overlay-nnlite.conf"
#
# TF-M is pre-provisioned on the PSE84 secure side; no --sysbuild needed.
# Zephyr runs in the M33 secure world (TRUSTED_EXECUTION_SECURE=y).

# --- Infineon ML Middleware ---
CONFIG_ML_MIDDLEWARE_INFINEON=y
CONFIG_ML_MIDDLEWARE_TFLITE_INTERPRETER=y
CONFIG_ML_MIDDLEWARE_INT8=y

# --- NNLite NPU via ML Middleware ---
CONFIG_ML_MIDDLEWARE_NNLITE=y

# Dynamic interrupt support required by the Cy_SysInt_Init Zephyr shim.
# cy_nn_kernel.c calls Cy_SysInt_Init() to register the NNLite/DMA ISRs at
# runtime.  The shim (modelled on cat1a/common/soc.c) uses irq_connect_dynamic,
# which requires CONFIG_DYNAMIC_INTERRUPTS=y.  Without it the shim compiles but
# does nothing and the NNLite interrupt never fires.
CONFIG_DYNAMIC_INTERRUPTS=y

# Note: CONFIG_TENSORFLOW_LITE_MICRO must NOT be set here.
# The Infineon ml-tflite-micro asset provides libtensorflow-microlite.a
# (precompiled, NPU-variant-specific). Enabling the Zephyr source-built
# tflite-micro module simultaneously causes duplicate symbol link errors.

# --- C++ runtime (required by mtb_ml_model.cpp and TFLite) ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# --- Memory (M33 NS total RAM ~132KB; keep heap small) ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Console/logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
