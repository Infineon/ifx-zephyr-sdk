# Overlay for M55 + Ethos-U55 + Infineon ML Middleware + DEEPCRAFT IMAI model
#
# Build command:
#   west build --pristine -b kit_pse84_ai/pse846gps2dbzc4a/m55 --sysbuild \
#     samples/boards/infineon/kit_pse84_ai/ml-example \
#     -- -DOVERLAY_CONFIG="overlay-m55-imai.conf"
#
# Architecture:
#   DEEPCRAFT model.c (IMAI_init/enqueue/dequeue)
#     -> Infineon ML Middleware (mtb_ml_model_init, mtb_ml_model_run)
#       -> TFLite Micro interpreter (Infineon precompiled libtensorflow-microlite.a)
#         -> Ethos-U delegate (Vela-compiled model ops dispatched to U55 NPU)
#
# Hardware init for Ethos-U55 is done at board level via CONFIG_ETHOS_U_INFINEON.
# The Infineon ML Middleware layer (COMPONENT_ML_TFLM) sits on top without
# duplicating hardware init — mtb_ml_init() is a lightweight counter when
# COMPONENT_U55 is not defined.

# --- Infineon ML Middleware ---
CONFIG_ML_MIDDLEWARE_INFINEON=y
CONFIG_ML_MIDDLEWARE_TFLITE_INTERPRETER=y
# INT8x8: required by DEEPCRAFT Radar model (int8 quantized, Vela-compiled)
CONFIG_ML_MIDDLEWARE_INT8=y

# --- C++ runtime (required by mtb_ml_model.cpp and TFLite) ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# --- Ethos-U55 NPU via Infineon ML Middleware ---
# CONFIG_ML_MIDDLEWARE_ETHOS_U55: selects the Ethos-U55 path inside the ML
#   Middleware. The ML Middleware owns all NPU hardware init (ethosu_init etc.)
#   directly via mtb_ml_ethosu.c + ethos-u-core-driver compiled by the
#   ml-middleware CMakeLists.
#   The TFLite Micro CUSTOM op kernel (Register_ETHOSU / GetString_ETHOSU) is
#   also compiled by ml-middleware CMakeLists (ethosu_tflm_kernel.cc).
#   CONFIG_ETHOS_U is intentionally NOT set: it would auto-select
#   CONFIG_ETHOS_U_INFINEON (the native Zephyr vendor driver) which conflicts
#   with the ML Middleware's own NPU init.
CONFIG_ML_MIDDLEWARE_ETHOS_U55=y
# CONFIG_TAINT_BLOBS_TFLM_ETHOSU: allows linking Vela-compiled operator blobs
CONFIG_TAINT_BLOBS_TFLM_ETHOSU=y

# --- Memory ---
# model.h: buffers=32500, state=42924, readonly=93808 bytes
# Heap needed for mtb_ml_model_t + MTBTFLiteMicro C++ object (~4KB)
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Console/logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
